name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Admin to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 40
          EOF

      - name: Pull latest code
        run: |
          ssh deploy-server 'cd /home/ubuntu/wp-bulk-generator && git fetch origin main && git reset --hard origin/main'

      - name: Install dependencies
        run: |
          ssh deploy-server 'cd /home/ubuntu/wp-bulk-generator/admin && npm install --prefer-offline'

      - name: Build & restart Admin
        run: |
          ssh deploy-server 'cd /home/ubuntu/wp-bulk-generator && bash scripts/rebuild-admin.sh'

      - name: Health check
        run: |
          sleep 5
          ssh deploy-server 'curl -sf http://localhost:3000 -o /dev/null && echo "Admin OK" || echo "Admin FAIL"'
