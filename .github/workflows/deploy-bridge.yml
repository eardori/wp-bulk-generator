name: Deploy Bridge API + EC2 Agent

on:
  push:
    branches: [main]
    paths:
      - 'bridge-api/**'
      - '.github/workflows/deploy-bridge.yml'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 40
            TCPKeepAlive yes
          EOF

      - name: Pull & build
        timeout-minutes: 20
        run: |
          # Lightsail 메모리 부족(Swap 57%) 상황에서 빌드 중 SSH idle timeout 방지용 keepalive 적용
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 deploy-server << 'ENDSSH'
            set -e
            cd /home/ubuntu/wp-bulk-generator
            git fetch origin main
            git reset --hard origin/main
            cd bridge-api
            # 빌드 메모리 여유 확보 — Node 기본 heap이 부족하면 swap으로 늘어지며 SSH 끊김 유발
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm ci --no-audit --no-fund
            npm run build
          ENDSSH

      - name: Sync env secrets
        run: |
          ssh deploy-server << ENDSSH
            ENV_FILE="/home/ubuntu/wp-bulk-generator/bridge-api/.env"
            touch "\$ENV_FILE"
            # BING_WEBMASTER_API_KEY_MYGROUND
            if grep -q '^BING_WEBMASTER_API_KEY_MYGROUND=' "\$ENV_FILE" 2>/dev/null; then
              sed -i 's/^BING_WEBMASTER_API_KEY_MYGROUND=.*/BING_WEBMASTER_API_KEY_MYGROUND=${{ secrets.BING_WEBMASTER_API_KEY_MYGROUND }}/' "\$ENV_FILE"
            else
              echo 'BING_WEBMASTER_API_KEY_MYGROUND=${{ secrets.BING_WEBMASTER_API_KEY_MYGROUND }}' >> "\$ENV_FILE"
            fi
            # INDEXNOW_API_KEY — 모든 서버(deploy-wp-sites.sh 포함)가 같은 키를 공유해야 함
            if [ -n '${{ secrets.INDEXNOW_API_KEY }}' ]; then
              if grep -q '^INDEXNOW_API_KEY=' "\$ENV_FILE" 2>/dev/null; then
                sed -i 's|^INDEXNOW_API_KEY=.*|INDEXNOW_API_KEY=${{ secrets.INDEXNOW_API_KEY }}|' "\$ENV_FILE"
              else
                echo 'INDEXNOW_API_KEY=${{ secrets.INDEXNOW_API_KEY }}' >> "\$ENV_FILE"
              fi
              # shell 스크립트용 /root/.wp-bulk-indexnow-key 도 동기화
              sudo tee /root/.wp-bulk-indexnow-key > /dev/null <<< '${{ secrets.INDEXNOW_API_KEY }}'
              sudo chmod 600 /root/.wp-bulk-indexnow-key
            fi
            # GEMINI_CONFIG_MODEL: 2.5-flash는 503 과부하, 2.0-flash는 신규 단종 → lite로 고정
            if grep -q '^GEMINI_CONFIG_MODEL=' "\$ENV_FILE" 2>/dev/null; then
              sed -i 's|^GEMINI_CONFIG_MODEL=.*|GEMINI_CONFIG_MODEL=gemini-2.5-flash-lite|' "\$ENV_FILE"
            else
              echo 'GEMINI_CONFIG_MODEL=gemini-2.5-flash-lite' >> "\$ENV_FILE"
            fi
            if grep -q '^GEMINI_CONFIG_FALLBACK_MODEL=' "\$ENV_FILE" 2>/dev/null; then
              sed -i 's|^GEMINI_CONFIG_FALLBACK_MODEL=.*|GEMINI_CONFIG_FALLBACK_MODEL=gemini-2.5-flash|' "\$ENV_FILE"
            else
              echo 'GEMINI_CONFIG_FALLBACK_MODEL=gemini-2.5-flash' >> "\$ENV_FILE"
            fi
            # 2026-04-22 Bing 적극 제출 금지 방침 — 서버 env 에 false 강제
            for KEY in BING_URL_SUBMISSION_ENABLED INDEXNOW_ENABLED; do
              if grep -q "^\${KEY}=" "\$ENV_FILE" 2>/dev/null; then
                sed -i "s|^\${KEY}=.*|\${KEY}=false|" "\$ENV_FILE"
              else
                echo "\${KEY}=false" >> "\$ENV_FILE"
              fi
            done
          ENDSSH

      - name: Restart services
        run: |
          ssh deploy-server << 'ENDSSH'
            # EC2 Agent (localhost only, 파일시스템 접근)
            pm2 delete ec2-agent 2>/dev/null || true
            pm2 start /home/ubuntu/wp-bulk-generator/bridge-api/dist/ec2-agent.js \
              --name ec2-agent \
              --cwd /home/ubuntu/wp-bulk-generator/bridge-api \
              --max-memory-restart 100M

            # Bridge API (외부 접근, Playwright + AI 생성)
            pm2 delete wp-bridge-api 2>/dev/null || true
            pm2 start /home/ubuntu/wp-bulk-generator/bridge-api/dist/server.js \
              --name wp-bridge-api \
              --cwd /home/ubuntu/wp-bulk-generator/bridge-api \
              --max-memory-restart 250M

            pm2 save
          ENDSSH

      - name: Health check
        run: |
          sleep 5
          ssh deploy-server << 'ENDSSH'
            echo "--- EC2 Agent ---"
            curl -sf http://localhost:4001/health && echo ' OK' || echo ' FAIL'
            echo "--- Bridge API ---"
            curl -sf http://localhost:4000/health && echo ' OK' || echo ' FAIL'
          ENDSSH

      - name: Fix http→https (robots.txt + WordPress siteurl)
        run: |
          ssh deploy-server << 'ENDSSH'
            # Primary 서버 robots.txt
            COUNT=$(sudo find /var/www -maxdepth 2 -name robots.txt -exec grep -l 'http://' {} \; 2>/dev/null | while read f; do sudo sed -i 's|http://|https://|g' "$f" && echo "$f"; done | wc -l)
            echo "Primary robots.txt 갱신: ${COUNT}개"

            # Secondary 서버
            source /home/ubuntu/wp-bulk-generator/bridge-api/.env 2>/dev/null || true
            if [ -n "${SECONDARY_SERVER_HOST:-}" ]; then
              SEC_USER="${SECONDARY_SERVER_USER:-junguyehong}"
              SEC_KEY="${SECONDARY_SERVER_KEY_PATH:-}"
              if [ -n "$SEC_KEY" ] && [ -f "$SEC_KEY" ]; then
                # robots.txt 수정
                SEC_COUNT=$(ssh -i "$SEC_KEY" -o StrictHostKeyChecking=no "$SEC_USER@$SECONDARY_SERVER_HOST" \
                  "sudo find /var/www -maxdepth 2 -name robots.txt -exec grep -l 'http://' {} \; 2>/dev/null | while read f; do sudo sed -i 's|http://|https://|g' \"\$f\" && echo \"\$f\"; done | wc -l" 2>/dev/null || echo "0")
                echo "Secondary robots.txt 갱신: ${SEC_COUNT}개"

                # WordPress siteurl/home http→https 일괄 수정
                WP_COUNT=$(ssh -i "$SEC_KEY" -o StrictHostKeyChecking=no "$SEC_USER@$SECONDARY_SERVER_HOST" '
                  COUNT=0
                  for d in /var/www/*/wp-config.php; do
                    SITE_DIR="$(dirname "$d")"
                    HOME_URL=$(sudo wp option get home --path="$SITE_DIR" --allow-root 2>/dev/null || true)
                    if echo "$HOME_URL" | grep -q "^http://"; then
                      NEW_URL=$(echo "$HOME_URL" | sed "s|^http://|https://|")
                      sudo wp option update home "$NEW_URL" --path="$SITE_DIR" --allow-root --quiet 2>/dev/null
                      sudo wp option update siteurl "$NEW_URL" --path="$SITE_DIR" --allow-root --quiet 2>/dev/null
                      echo "  ✓ $NEW_URL"
                      COUNT=$((COUNT+1))
                    fi
                  done
                  echo "$COUNT"
                ' 2>/dev/null | tail -1 || echo "0")
                echo "Secondary WordPress https 갱신: ${WP_COUNT}개"
              fi
            fi
          ENDSSH
